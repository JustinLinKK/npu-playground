[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npu-agent"
version = "0.1.0"
description = "Agentic CUDA, Triton, and HIP to NPU translation framework"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.6.0",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
npu-agent = "npu_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npu_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
